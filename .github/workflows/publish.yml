# Publishes the package to npm when a GitHub release is published, through npm's trusted publishing (no token).
# Set it up once on npmjs.com: the package's Settings, Trusted Publisher, GitHub Actions, workflow publish.yml.
name: Publish
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches the version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p 'require("./package.json").version')"
      - run: npm test
      - run: npm publish --provenance --access public
